name: Profile metrics

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 06:00 America/Bogota
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'metrics/**'

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: estebansa19
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Bogota
          repositories_affiliations: owner, collaborator, organization_member

      # The metrics languages plugin renders an empty card - its own published
      # example has a language count but no bars - so build that card directly.
      - name: Most used languages
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/languages_card.py

      - name: Commit languages card
        run: |
          if git diff --quiet -- metrics/languages.svg; then
            echo "languages card unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/languages.svg
          git commit -m "Update metrics/languages.svg - [Skip GitHub Action]"
          # The metrics step commits via the API, so the remote is already ahead.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
