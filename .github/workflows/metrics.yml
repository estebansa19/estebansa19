name: Profile cards

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 06:00 America/Bogota
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'metrics/**'

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Both cards are generated here rather than by a third-party action: the
      # upstream languages plugin renders empty, and its overview card was all
      # zeroes for work that is private rather than absent.
      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 .github/scripts/overview_card.py
          python3 .github/scripts/languages_card.py

      - name: Commit cards
        run: |
          if git diff --quiet -- metrics; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "Update profile cards [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
